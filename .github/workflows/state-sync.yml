name: state-sync

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install huggingface_hub
        run: pip install huggingface_hub==0.34.4

      - name: Pull rasi-state into a timestamped snapshot (keep last 48)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/collect-state.py

      - name: Commit snapshot
        run: |
          git config user.name "rasi-state-bot"
          git config user.email "actions@users.noreply.github.com"
          git add snapshots/
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "state snapshot $(date -u +%Y%m%dT%H%M%SZ)"
            git push
          fi